---
- name: Download the Splunk package (Enterprise Linux)
  ansible.builtin.get_url:
    url: "{{ splunk_forwarder_rpm_url }}"
    dest: /tmp/{{ splunk_forwarder_rpm_name }}
    checksum: "{{ splunk_forwarder_rpm_hash }}"
    mode: "0664"

- name: Install Splunk (python2 yum)
  ansible.builtin.yum:
    name: /tmp/{{ splunk_forwarder_rpm_name }}
    state: present
